# All-in-one environment: run the workflow without --sdm conda.
# vespa and hifiasm are not here: the workflow downloads the pinned releases (tools.yaml).
# DeepVariant (haplotag.mode: deepvariant) runs from a container.
name: vespa
channels: [conda-forge, bioconda]
dependencies:
  - python>=3.9
  - snakemake-minimal>=8
  - pyyaml
  - minimap2=2.30
  - samtools=1.23.1
  - bcftools=1.23.1
  - htslib=1.23.1
  - pysam=0.24.0
  - whatshap=2.8
